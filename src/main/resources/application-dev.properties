# ===================================================================
# Development Profile Configuration (dev)
# ===================================================================

# Server Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

# CORS - Allowed Origins for Local Development (Vite / React default ports)
portfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator Health Details
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.root=INFO
logging.level.com.portfolio.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.mail=DEBUG

