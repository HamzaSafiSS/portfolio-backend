# ===================================================================
# Production Profile Configuration (prod)
# ===================================================================

# Server Error Handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# CORS - Configured strictly via environment variable in production
portfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Actuator Endpoints - Health only, zero sensitive details exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Production Logging Configuration (No verbose or sensitive data)
logging.level.root=WARN
logging.level.com.portfolio.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.mail=WARN
