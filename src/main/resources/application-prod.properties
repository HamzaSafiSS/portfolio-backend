# ===================================================================
# Production Profile Configuration (prod)
# ===================================================================

# Server Error Handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# CORS - Configured strictly via environment variable in production
portfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Actuator Health Details - Restricted in production
management.endpoint.health.show-details=never

# Logging Configuration
logging.level.root=WARN
logging.level.com.portfolio.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.mail=WARN

