# ===================================================================
# Application Core Configuration
# ===================================================================
spring.application.name=portfolio-backend

# Default Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server Configuration (Supports PORT for cloud hosts and SERVER_PORT locally)
server.port=${PORT:${SERVER_PORT:8080}}

# Brevo SMTP Configuration (Port 2525 with STARTTLS for Render Free Tier)
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.debug=false

# Portfolio Contact Email Routing
portfolio.mail.from=${MAIL_FROM:}
portfolio.mail.receiver=${CONTACT_RECEIVER_EMAIL:}

# CORS Configuration
portfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Rate Limiting Configuration
portfolio.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:5}
portfolio.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=false
