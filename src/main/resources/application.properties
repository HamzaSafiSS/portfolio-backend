# ===================================================================
# Application Core Configuration
# ===================================================================
spring.application.name=portfolio-backend

# Default Active Profile
spring.profiles.active=dev

# Server Configuration
server.port=${SERVER_PORT:8080}

# Brevo SMTP Configuration (Environment-backed)
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

# Portfolio Contact Email Routing
portfolio.mail.from=${MAIL_FROM:}
portfolio.mail.receiver=${CONTACT_RECEIVER_EMAIL:}

# CORS Configuration
portfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Actuator Endpoints Configuration
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
